apiVersion: v1
kind: Secret
metadata:
  name: closedloop-secrets
  namespace: closedloop
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://closedloop:password@postgres/closedloop
  JWT_SECRET: replace-me
  ENCRYPTION_KEY: replace-me-32-bytes
  AZURE_OPENAI_ENDPOINT: https://your-resource.openai.azure.com/
  AZURE_OPENAI_API_KEY: replace-me
  GITHUB_CLIENT_ID: replace-me
  GITHUB_CLIENT_SECRET: replace-me
  SLACK_CLIENT_ID: replace-me
  SLACK_CLIENT_SECRET: replace-me
