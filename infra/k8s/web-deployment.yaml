apiVersion: apps/v1
kind: Deployment
metadata:
  name: closedloop-web
  namespace: closedloop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: closedloop-web
  template:
    metadata:
      labels:
        app: closedloop-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/closedloop-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.closedloop.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: closedloop-web
  namespace: closedloop
spec:
  selector:
    app: closedloop-web
  ports:
    - port: 80
      targetPort: 3000
